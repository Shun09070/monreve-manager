<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b56"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="monrêve">
<link rel="apple-touch-icon" href="./icons/icon-180.png"><link rel="manifest" href="./manifest.webmanifest">
<title>monrêve Manager</title>
<style>
:root{--bg:#f6f3eb;--card:#fffdfa;--ink:#263c35;--muted:#7f8a85;--green:#2f6b56;--gold:#f1c985;--line:#dfe5df;--danger:#b25555}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
button,input,select,textarea{font:inherit}.app{max-width:760px;margin:auto;padding:18px 16px calc(104px + env(safe-area-inset-bottom))}
header{padding-top:calc(12px + env(safe-area-inset-top));margin-bottom:14px}.date{font-size:12px;color:var(--muted)}.title{font-size:28px;margin-top:4px;font-weight:600}
.page{display:none}.page.active{display:block}.hero{background:linear-gradient(150deg,#285f4c,#3d7e66);color:#fff;border-radius:28px;padding:24px}
.hero h2{font-family:Georgia,serif;font-size:30px;margin:10px 0}.hero-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:18px}.hero-stat{background:#ffffff17;border-radius:17px;padding:12px}.hero-stat b{display:block;font-size:21px}.hero-stat span{font-size:10px;opacity:.8}
.gold{width:100%;margin-top:16px;border:0;background:var(--gold);color:#244a3e;border-radius:16px;padding:14px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:13px}.card h3{margin:0 0 10px}.quick,.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.quick button,.menu button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:13px;text-align:left}.quick small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.section-head{display:flex;justify-content:space-between;align-items:center}.section-head h2{margin:0}.add{width:42px;height:42px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:24px}
.list{display:grid;gap:9px;margin-top:12px}.item{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px}.item-top{display:flex;justify-content:space-between}.item h4{margin:0 0 5px}.meta{font-size:12px;color:var(--muted);line-height:1.55}.badge{display:inline-block;background:#edf5f1;color:var(--green);border-radius:999px;padding:4px 7px;font-size:10px;margin:6px 4px 0 0}.delete{border:0;background:transparent;color:var(--danger);font-size:11px}
.ai{background:#1f4237;color:#fff;border-radius:22px;padding:16px}.ai textarea{width:100%;min-height:110px;border:0;border-radius:13px;padding:11px;margin:10px 0}.ai-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ai-actions button{border:0;border-radius:13px;padding:12px;font-weight:800}.a{background:var(--gold);color:#244a3e}.b{background:#fff;color:#244a3e}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(6,1fr);background:#fffdfaf2;border-top:1px solid var(--line);padding:8px 2px calc(8px + env(safe-area-inset-bottom))}
.bottom button{border:0;background:transparent;color:#8d9691;display:flex;flex-direction:column;align-items:center;font-size:18px}.bottom span{font-size:9px}.bottom button.active{color:var(--green);font-weight:800}
.sheet,.modal{display:none;position:fixed;inset:0;z-index:60;background:#1d2a2570;align-items:flex-end}.sheet.active,.modal.active{display:flex}.sheet-card,.modal-card{width:100%;background:var(--card);border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.sheet-head{display:flex;justify-content:space-between;align-items:center}.close{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff}
.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:11px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.field textarea{min-height:82px}.save{width:100%;border:0;border-radius:13px;background:var(--green);color:#fff;padding:13px;font-weight:800}
.install{border:1px dashed #9db3a8;background:#f9fbf8;border-radius:16px;padding:13px;font-size:12px;line-height:1.6}.install button{margin-top:8px;border:0;background:var(--green);color:#fff;border-radius:12px;padding:10px 12px;font-weight:700}
.analysis{margin:10px 0}.line{display:flex;justify-content:space-between;font-size:12px}.bar{height:8px;background:#e8ede9;border-radius:999px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
</style></head><body>
<div class="app">
<header><div class="date" id="date"></div><div class="title" id="title">ホーム</div></header>
<section id="home" class="page active">
<div class="hero"><small>今日のmonrêve</small><h2>創作を、少しずつ前へ。</h2><div class="hero-grid">
<div class="hero-stat"><b id="hTasks">0</b><span>優先タスク</span></div><div class="hero-stat"><b id="hWorks">0</b><span>制作中</span></div><div class="hero-stat"><b id="hPosts">0</b><span>投稿予定</span></div><div class="hero-stat"><b id="hStock">0</b><span>在庫警告</span></div>
</div><button class="gold" data-page="ai">今日何を優先する？</button></div>
<div class="card"><h3>今月</h3><div class="hero-grid" style="margin:0"><div class="hero-stat" style="background:#edf5f1;color:var(--ink)"><b id="mSales">¥0</b><span>売上</span></div><div class="hero-stat" style="background:#edf5f1;color:var(--ink)"><b id="mProfit">¥0</b><span>純利益</span></div></div></div>
<div class="card"><h3>すぐ登録</h3><div class="quick"><button data-add="tasks">＋ タスク<small>期限・優先度</small></button><button data-add="works">＋ 制作<small>作品・撮影・出品</small></button><button data-add="sales">＋ 売上<small>利益を自動計算</small></button><button data-add="content">＋ 発信<small>配信・note・YouTube</small></button></div></div>
<div class="card"><h3>マネージャー提案</h3><div id="tips" class="meta"></div></div>
<div class="card"><h3>アプリにする</h3><div class="install">iPhoneではSafariで公開URLを開き、共有 →「ホーム画面に追加」でインストールできます。<button id="installHelp">手順を見る</button></div></div>
</section>
<section id="tasks" class="page"><div class="section-head"><h2>タスク</h2><button class="add" data-add="tasks">＋</button></div><div id="tasksList" class="list"></div></section>
<section id="works" class="page"><div class="section-head"><h2>制作</h2><button class="add" data-add="works">＋</button></div><div id="worksList" class="list"></div></section>
<section id="sales" class="page"><div class="section-head"><h2>販売</h2><button class="add" data-add="sales">＋</button></div><div class="card"><h3>販売先別</h3><div id="salesAnalysis"></div></div><div id="salesList" class="list"></div></section>
<section id="ai" class="page"><div class="section-head"><h2>AIマネージャー</h2></div><div class="ai">ChatGPTへ相談<textarea id="question" placeholder="例：今週何を優先したらいい？"></textarea><div class="ai-actions"><button class="a" id="copyPrompt">相談文を作る</button><button class="b" id="openChat">ChatGPTを開く</button></div><div id="aiStatus" style="font-size:11px;margin-top:8px"></div></div></section>
<section id="ideas" class="page"><div class="section-head"><h2>企画・アイデア</h2><button class="add" data-add="ideas">＋</button></div><div id="ideasList" class="list"></div></section>
<section id="inventory" class="page"><div class="section-head"><h2>在庫</h2><button class="add" data-add="inventory">＋</button></div><div id="inventoryList" class="list"></div></section>
<section id="expenses" class="page"><div class="section-head"><h2>経費・会計</h2><button class="add" data-add="expenses">＋</button></div><div id="expensesList" class="list"></div></section>
<section id="events" class="page"><div class="section-head"><h2>出店・販売企画</h2><button class="add" data-add="events">＋</button></div><div id="eventsList" class="list"></div></section>
<section id="content" class="page"><div class="section-head"><h2>配信・発信</h2><button class="add" data-add="content">＋</button></div><div id="contentList" class="list"></div></section>
<section id="meetings" class="page"><div class="section-head"><h2>会議・週次レビュー</h2><button class="add" data-add="meetings">＋</button></div><div id="meetingsList" class="list"></div></section>
<section id="data" class="page"><div class="section-head"><h2>データ管理</h2></div><div class="card"><div class="quick"><button id="backup">バックアップ</button><button id="restoreBtn">復元</button><button id="csv">売上CSV</button><button id="print">印刷</button></div><input id="restoreFile" type="file" accept=".json" hidden></div></section>
</div>
<nav class="bottom"><button class="active" data-page="home">⌂<span>ホーム</span></button><button data-page="tasks">▤<span>タスク</span></button><button data-page="works">◫<span>制作</span></button><button data-page="sales">▣<span>販売</span></button><button data-page="ai">✦<span>AI</span></button><button id="more">⊕<span>便利機能</span></button></nav>
<div class="sheet" id="moreSheet"><div class="sheet-card"><div class="sheet-head"><h3>便利機能</h3><button class="close" id="closeMore">×</button></div><div class="menu"><button data-page="ideas">企画・アイデア</button><button data-page="inventory">在庫</button><button data-page="expenses">経費・会計</button><button data-page="events">イベント・WS・委託</button><button data-page="content">配信・note・YouTube</button><button data-page="meetings">会議・週次レビュー</button><button data-page="data">データ管理</button></div></div></div>
<div class="modal" id="modal"><div class="modal-card"><form id="form"><div class="sheet-head"><h3 id="formTitle">追加</h3><button class="close" type="button" id="closeModal">×</button></div><div id="fields"></div><button class="save">保存</button></form></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], yen=v=>"¥"+Number(v||0).toLocaleString("ja-JP");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const KEY="monreve_manager_sites_ready_v1"; const empty=()=>({tasks:[],works:[],sales:[],ideas:[],inventory:[],expenses:[],events:[],content:[],meetings:[]});
let db=load(), kind=null; function load(){try{return Object.assign(empty(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch{return empty()}} function save(){localStorage.setItem(KEY,JSON.stringify(db))} function nid(){return Date.now()+Math.floor(Math.random()*9999)}
const cfg={tasks:["タスク追加",[["title","タイトル","text"],["priority","優先度","select",["低","中","高"]],["status","状態","select",["未着手","進行中","保留","完了"]],["due","期限","date"],["memo","メモ","textarea"]]],works:["制作登録",[["name","作品名","text"],["category","種類","select",["ビーズ","天然石","レジン","消しゴムはんこ","イラスト","抽象画","LINEスタンプ","その他"]],["status","状態","select",["企画","制作中","完成","撮影済み","出品済み"]],["cost","原価","number"],["price","販売価格","number"],["stock","完成数","number"],["photo","撮影","select",["未撮影","撮影中","撮影済み"]],["listing","出品","select",["未出品","準備中","出品済み"]],["memo","メモ","textarea"]]],sales:["売上登録",[["date","日付","date"],["channel","販売先","select",["minne","BASE","イベント","ワークショップ","委託販売","オーダー","その他"]],["item","商品名","text"],["qty","数量","number"],["amount","売上","number"],["cost","原価","number"],["fee","手数料","number"],["shipping","送料","number"],["memo","メモ","textarea"]]],ideas:["アイデア追加",[["title","タイトル","text"],["category","カテゴリ","select",["配信","制作","note","YouTube","LINEスタンプ","販売","イベント","ワークショップ","委託販売","ラッピング","その他"]],["status","状態","select",["思いつき","検討中","採用","制作中","完成","投稿・販売済み","保留"]],["memo","内容","textarea"]]],inventory:["在庫登録",[["name","材料・商品名","text"],["category","種類","select",["完成品","材料","金具","梱包","ラッピング","その他"]],["qty","数量","number"],["unit","単位","text"],["alert","警告ライン","number"],["unitCost","単価","number"],["supplier","仕入先","text"],["memo","メモ","textarea"]]],expenses:["経費登録",[["date","日付","date"],["category","科目","select",["材料費","消耗品費","荷造運賃","通信費","旅費交通費","広告宣伝費","支払手数料","出店料","その他"]],["desc","内容","text"],["amount","金額","number"],["ratio","事業割合%","number"],["memo","メモ","textarea"]]],events:["出店企画",[["name","名称","text"],["type","種類","select",["イベント","ワークショップ","委託販売"]],["date","日付","date"],["place","場所・委託先","text"],["fee","出店料等","number"],["target","売上目標","number"],["status","状態","select",["検討中","応募予定","準備中","確定","終了","中止"]],["memo","メモ","textarea"]]],content:["発信企画",[["title","タイトル","text"],["platform","媒体","select",["Pococha","パルム","note","YouTube","Instagram","LINEスタンプ","その他"]],["status","状態","select",["アイデア","準備中","制作中","予約済み","公開済み","投稿済み"]],["publish","公開予定日","date"],["goal","目標","text"],["memo","内容","textarea"]]],meetings:["会議記録",[["title","タイトル","text"],["date","日付","date"],["summary","まとめ","textarea"],["decisions","決定事項","textarea"],["next","次にやること","textarea"]]]};
const titles={home:"ホーム",tasks:"タスク",works:"制作",sales:"販売",ai:"AIマネージャー",ideas:"企画・アイデア",inventory:"在庫",expenses:"経費・会計",events:"出店・販売企画",content:"配信・発信",meetings:"会議",data:"データ管理"};
function page(id){$$(".page").forEach(p=>p.classList.toggle("active",p.id===id));$$("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===id));$("#title").textContent=titles[id]||"monrêve";$("#moreSheet").classList.remove("active");if(id==="sales")analysis();window.scrollTo(0,0)}
function openForm(k){kind=k;$("#formTitle").textContent=cfg[k][0];$("#fields").innerHTML=cfg[k][1].map(([n,l,t,o])=>`<div class="field"><label>${l}</label>${t==="select"?`<select name="${n}">${o.map(v=>`<option>${v}</option>`).join("")}</select>`:t==="textarea"?`<textarea name="${n}"></textarea>`:`<input name="${n}" type="${t}" ${["title","name","item","desc"].includes(n)?"required":""}>`}</div>`).join("");$("#modal").classList.add("active")}
document.addEventListener("click",e=>{let p=e.target.closest("[data-page]");if(p){page(p.dataset.page);return}let a=e.target.closest("[data-add]");if(a){openForm(a.dataset.add);return}});
$("#more").onclick=()=>$("#moreSheet").classList.add("active");$("#closeMore").onclick=()=>$("#moreSheet").classList.remove("active");$("#closeModal").onclick=()=>$("#modal").classList.remove("active");
$("#form").onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target).entries());x.id=nid();db[kind].unshift(x);save();$("#modal").classList.remove("active");e.target.reset();render()};
window.del=(k,i)=>{if(confirm("削除しますか？")){db[k]=db[k].filter(x=>x.id!==i);save();render()}}
function card(k,r){let d=`<button class="delete" onclick="del('${k}',${r.id})">削除</button>`;if(k==="tasks")return `<div class="item"><div class="item-top"><h4>${esc(r.title)}</h4>${d}</div><div class="meta">${esc(r.memo)}</div><span class="badge">${esc(r.status)}</span><span class="badge">優先 ${esc(r.priority)}</span></div>`;if(k==="works")return `<div class="item"><div class="item-top"><h4>${esc(r.name)}</h4>${d}</div><div class="meta">${esc(r.category)} / ${esc(r.status)}<br>原価 ${yen(r.cost)}・販売 ${yen(r.price)}</div></div>`;if(k==="sales"){let p=Number(r.amount||0)-Number(r.cost||0)-Number(r.fee||0)-Number(r.shipping||0);return `<div class="item"><div class="item-top"><h4>${esc(r.item)}</h4>${d}</div><div class="meta">${esc(r.date)} / ${esc(r.channel)}<br>売上 ${yen(r.amount)}・利益 ${yen(p)}</div></div>`}if(k==="inventory"){let low=Number(r.alert)>0&&Number(r.qty)<=Number(r.alert);return `<div class="item"><div class="item-top"><h4>${esc(r.name)} ${low?"⚠️":""}</h4>${d}</div><div class="meta">${esc(r.category)} / ${esc(r.qty)} ${esc(r.unit)}</div></div>`}if(k==="expenses")return `<div class="item"><div class="item-top"><h4>${esc(r.desc)}</h4>${d}</div><div class="meta">${esc(r.date)} / ${esc(r.category)} / ${yen(r.amount)}</div></div>`;if(k==="events")return `<div class="item"><div class="item-top"><h4>${esc(r.name)}</h4>${d}</div><div class="meta">${esc(r.type)} / ${esc(r.date)} / ${esc(r.place)}</div></div>`;if(k==="content")return `<div class="item"><div class="item-top"><h4>${esc(r.title)}</h4>${d}</div><div class="meta">${esc(r.platform)} / ${esc(r.publish)}<br>${esc(r.memo)}</div></div>`;if(k==="ideas")return `<div class="item"><div class="item-top"><h4>${esc(r.title)}</h4>${d}</div><div class="meta">${esc(r.memo)}</div></div>`;return `<div class="item"><div class="item-top"><h4>${esc(r.title)}</h4>${d}</div><div class="meta">${esc(r.date)}<br>${esc(r.summary)}</div></div>`}
function analysis(){const ch={};db.sales.forEach(x=>{let k=x.channel||"未設定";ch[k]=(ch[k]||0)+Number(x.amount||0)});let arr=Object.entries(ch).sort((a,b)=>b[1]-a[1]);if(!arr.length){$("#salesAnalysis").innerHTML='<div class="meta">まだデータがありません。</div>';return}let max=Math.max(...arr.map(x=>x[1]),1);$("#salesAnalysis").innerHTML=arr.map(([k,v])=>`<div class="analysis"><div class="line"><span>${esc(k)}</span><b>${yen(v)}</b></div><div class="bar"><i style="width:${Math.max(4,v/max*100)}%"></i></div></div>`).join("")}
function promptText(){let open=db.tasks.filter(x=>x.status!=="完了"),low=db.inventory.filter(x=>Number(x.alert)>0&&Number(x.qty)<=Number(x.alert));return `あなたはmonrêveの専属AIマネージャーです。未完了タスク${open.length}件、制作中${db.works.filter(x=>x.status==="制作中").length}作品、在庫警告${low.length}件、発信企画${db.content.length}件です。相談: ${$("#question").value||"今日何を優先すべきか3つ提案してください。"} 優先順位・理由・次の行動の順で回答してください。`}
async function copyPrompt(){let t=promptText();try{await navigator.clipboard.writeText(t)}catch{let a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}$("#aiStatus").textContent="相談文をコピーしました。"}
$("#copyPrompt").onclick=copyPrompt;$("#openChat").onclick=async()=>{await copyPrompt();window.open("https://chatgpt.com/","_blank")};$("#installHelp").onclick=()=>alert("iPhone: Safariで開く → 共有 →『ホーム画面に追加』→ 追加");
$("#backup").onclick=()=>{let b=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="monreve_backup.json";a.click();URL.revokeObjectURL(a.href)};$("#restoreBtn").onclick=()=>$("#restoreFile").click();$("#restoreFile").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=Object.assign(empty(),JSON.parse(r.result));save();render();alert("復元しました")}catch{alert("復元に失敗しました")}};r.readAsText(f)};$("#csv").onclick=()=>{let c=["date","channel","item","qty","amount","cost","fee","shipping","memo"],csv="\ufeff"+c.join(",")+"\n"+db.sales.map(r=>c.map(k=>`"${String(r[k]??"").replaceAll('"','""')}"`).join(",")).join("\n");let b=new Blob([csv],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="monreve_sales.csv";a.click();URL.revokeObjectURL(a.href)};$("#print").onclick=()=>window.print();
