<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="monrêve">
  <meta name="theme-color" content="#f6f0e7">
  <title>monrêve Manager</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      background: #f6f0e7;
      color: #25443a;
      padding: 24px;
    }
    .card {
      background: #2e6654;
      color: white;
      border-radius: 28px;
      padding: 28px;
      margin-top: 24px;
    }
    h1 { font-size: 34px; }
    .big {
      font-size: 48px;
      font-weight: bold;
      margin: 12px 0;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: #f1c47b;
      color: #25443a;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <p>monrêve Manager</p>
  <h1>ホーム</h1>

  <div class="card">
    <div>今日のmonrêve</div>
    <div class="big">3件</div>
    <div>制作中 2件</div>
    <div>出品待ち 4件</div>
    <div>今月の売上 ¥12,800</div>

    <button onclick="alert('動作しています！')">
      動作確認
    </button>
  </div>

</body>
</html>
